baseURL: "https://ethanjinhuang.github.io/"
locale: "en-US"
title: "Jin Huang | Zhejiang University"
theme: hugo-profile

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: experience
      name: Experience
      title: Experience
      url: /experience
      weight: 6
    - identifier: award
      name: Award
      title: Award
      url: /awards
      weight: 5
    - identifier: research
      name: Research
      title: Research
      url: /research
      weight: 4
    - identifier: publications
      name: Publications
      title: Publications
      url: /publications
      weight: 3

params:
  title: "Jin Huang's Profile"
  favicon: "/icons/wave.svg"
  description: "Welcome to my personal profile website!"
  # Whether the fade animations on the home page will be enabled
  animate: false
  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: true
  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left
  color:
    textColor: "#2d3742"
    secondaryTextColor: "#5c6b78"
    textLinkColor: "#1565c0"
    backgroundColor: "#f7f8fa"
    secondaryColor: "#ffffff"
    primaryColor: "#1565c0"
    darkmode:
      textColor: "#e8edf3"
      secondaryTextColor: "#b6c0cc"
      textLinkColor: "#8ab4f8"
      backgroundColor: "#101419"
      secondaryColor: "#171d24"
      primaryColor: "#8ab4f8"

  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    brandName: "Jin Huang"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: false
    menus:
      disableAbout: true
      disableExperience: false
      disableEducation: true
      disableNews: false
      disableResearch: true
      disablePublications: true
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: false
    intro: "Hi, I'm"
    title: "Jin Huang (黄 瑾)"
    subtitle: "Ph.D. Candidate"
    content: "From Zhejiang University."
    contact: "From Zhejiang University."
    bottomImage:
      enable: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fas fa-envelope
          url: "mailto:jin.huang@zju.edu.cn"
        - icon: fab fa-researchgate
          url: "https://www.researchgate.net/profile/Jin-Huang-84?ev=hdr_xprf"
        - icon: fab fa-orcid
          url: "https://orcid.org/0000-0003-1309-8329"
        - icon: ai ai-google-scholar
          url: "https://scholar.google.com/citations?hl=en&user=dFbcMfIAAAAJ&view_op=list_works&sortby=pubdate"
        - icon: fab fa-github
          url: "https://github.com/ethanjinhuang"
        - icon: fab fa-linkedin
          url: "https://www.linkedin.com/in/jinhuang-zju"

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/profile/profile.jpg"
    content: |-
      I am a Ph.D. candidate at Zhejiang University, supervised by Prof. [Ying Chen](https://person.zju.edu.cn/en/0089096). From 2025 to 2026, I am also a special research student at the University of Tokyo, supervised by Prof. [Moju Zhao](https://www.dragon.t.u-tokyo.ac.jp/author/moju-zhao/).

      My research focuses on marine robotics, deeply integrated underwater navigation, and underwater acoustic sensing, with a particular interest in bio-inspired sensing and navigation for underwater robots. I develop underwater navigation and positioning systems, along with related algorithms, and validate them through real-world deployments and sea trials.
    interests:
      enable: false
      title: "Interests"
      items:
        - "Underwater Navigation & Positioning"
        - "Deep integrated Sensor Fusion"
        - "Underwater Acoustic Sensing"
    # skills:
    #   enable: true
    #   title: "Here are a few technologies I've been working with recently:"
    #   items:
    #     - "HTML"
    #     - "CSS"
    #     - "JavaScript"
    #     - "React"
    #     - "Node"
    #     - "Express"

  # News
  news:
    enable: true
    title: "News"
    # News items are managed in content/news/_index.md

  # LinkedIn Feed
  linkedinFeed:
    enable: false
    title: "LinkedIn Updates"
    description: "Recent LinkedIn activity and research notes."
    provider: "elfsight"
    elfsight:
      enable: true
      scriptUrl: "https://elfsightcdn.com/platform.js"
      appId: "e26aa956-bf1d-429f-ac7e-9cd292868163"
    maxPosts: 3
    profileUrl: "https://www.linkedin.com/in/jinhuang-zju/"
    activityUrl: "https://www.linkedin.com/in/jinhuang-zju/recent-activity/all/"

  # Education
  education:
    enable: true
    title: "Education"
    # Education list page data is maintained in content/experience/*.md (section: education).

  # Experience (for /experience page)
  # `enable` controls homepage section only.
  experience:
    enable: false
    title: "Experience"
    # Experience list page data is maintained in content/experience/*.md (section: experience).

  # Research
  research:
    enable: true
    title: "Research"

  # Publications
  publications:
    enable: true
    title: "Publications"
    # Publications are managed as Markdown files under content/publications/*.md
